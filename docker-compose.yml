version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopnow-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/shopnow
      NODE_ENV: development
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: shopnow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: /
        REACT_APP_API_BASE_URL: http://localhost:5000/api
    container_name: shopnow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: /
        REACT_APP_API_BASE_URL: http://localhost:5000/api
    container_name: shopnow-admin
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
